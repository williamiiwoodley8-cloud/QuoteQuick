<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteQuick</title><link rel="stylesheet" href="style.css"></head><body><header><h1>QuoteQuick</h1><p>Fast estimates for small businesses.</p></header><main><section class="card"><h2>Create Estimate</h2><label>Business name<input id="business" placeholder="Your Business"></label><label>Customer name<input id="customer" placeholder="Customer"></label><label>Customer email<input id="email" type="email" placeholder="customer@example.com"></label><label>Job description<textarea id="description" rows="3" placeholder="Describe the work"></textarea></label><div class="grid"><label>Labor ($)<input id="labor" type="number" value="0" min="0" step=".01"></label><label>Materials ($)<input id="materials" type="number" value="0" min="0" step=".01"></label><label>Other costs ($)<input id="other" type="number" value="0" min="0" step=".01"></label><label>Markup (%)<input id="markup" type="number" value="20" min="0" step=".1"></label></div><button id="generate">Generate Estimate</button></section><section class="card" id="estimate"><div class="head"><div><h2 id="outBusiness">Your Business</h2><b>ESTIMATE</b></div><div id="number"></div></div><hr><p><b>Customer:</b> <span id="outCustomer">—</span></p><p><b>Email:</b> <span id="outEmail">—</span></p><h3>Job</h3><p id="outDescription">—</p><table><tr><td>Labor</td><td id="outLabor">$0.00</td></tr><tr><td>Materials</td><td id="outMaterials">$0.00</td></tr><tr><td>Other</td><td id="outOther">$0.00</td></tr><tr><td>Markup</td><td id="outMarkup">$0.00</td></tr><tr class="total"><td>Total</td><td id="outTotal">$0.00</td></tr></table><button onclick="window.print()">Print / Save PDF</button></section></main><footer>QuoteQuick MVP</footer><script src="app.js"></script></body></html>
